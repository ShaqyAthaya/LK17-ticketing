<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesanan Berhasil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="/app.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="/">🎟️ Ticketing Event</a>
</nav>

<div class="container my-5">
  <div class="card shadow-sm p-4 text-center" style="max-width:500px;margin:auto;" id="content">
    <p class="text-muted mb-0">Memuat...</p>
  </div>
</div>

<script>
const kode = new URLSearchParams(location.search).get("kode");
const content = document.getElementById("content");
if (!kode) {
  showError(content, "Kode booking tidak ditemukan.");
} else {
  api("/api/orders/" + encodeURIComponent(kode)).then((o) => {
    content.innerHTML = `
      <div class="display-4 mb-2">✅</div>
      <h4 class="fw-bold mb-1">Pesanan Berhasil!</h4>
      <p class="text-muted mb-4">Simpan kode booking kamu di bawah ini</p>
      <div class="alert alert-dark fs-5 fw-bold">${esc(o.bookingCode)}</div>
      <table class="table table-bordered text-start mt-3">
        <tr><th>Event</th><td>${esc(o.eventTitle)}</td></tr>
        <tr><th>Tanggal</th><td>${tanggal(o.eventDate)}</td></tr>
        <tr><th>Lokasi</th><td>${esc(o.location)}</td></tr>
        <tr><th>Jenis Tiket</th><td>${esc(o.ticketName)}</td></tr>
        <tr><th>Nama</th><td>${esc(o.buyerName)}</td></tr>
        <tr><th>Email</th><td>${esc(o.buyerEmail)}</td></tr>
        <tr><th>Jumlah</th><td>${o.quantity} tiket</td></tr>
        <tr><th>Total</th><td>${rupiah(o.totalPrice)}</td></tr>
      </table>
      <a href="/" class="btn btn-dark w-100 mt-2">Kembali ke Beranda</a>`;
  }).catch((err) => showError(content, err.message));
}
</script>
</body>
</html>
