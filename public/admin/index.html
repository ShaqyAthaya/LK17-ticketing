<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="/app.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 d-flex justify-content-between">
  <span class="navbar-brand fw-bold">⚙️ Admin Panel</span>
  <div>
    <a href="/" class="btn btn-outline-light btn-sm me-2">Lihat Website</a>
    <button id="logout" class="btn btn-danger btn-sm">Logout</button>
  </div>
</nav>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Daftar Event</h5>
    <a href="/admin/tambah" class="btn btn-dark btn-sm">+ Tambah Event</a>
  </div>
  <div class="card shadow-sm mb-5 table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr><th>#</th><th>Judul</th><th>Tanggal</th><th>Lokasi</th><th>Status</th><th>Aksi</th></tr>
      </thead>
      <tbody id="events"></tbody>
    </table>
  </div>

  <h5 class="mb-3">Daftar Pemesan</h5>
  <div class="card shadow-sm table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th><th>Kode Booking</th><th>Nama</th><th>Email</th>
          <th>Event</th><th>Tiket</th><th>Qty</th><th>Total</th><th>Tanggal</th>
        </tr>
      </thead>
      <tbody id="orders"></tbody>
    </table>
  </div>
</div>

<script>
function handleAuth(err) {
  if (err.status === 401) location.href = "/admin/login";
  else alert(err.message);
}

async function load() {
  const [events, orders] = await Promise.all([
    api("/api/admin/events"),
    api("/api/admin/orders"),
  ]);

  document.getElementById("events").innerHTML = events.map((e, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${esc(e.title)}</td>
      <td>${tanggal(e.eventDate, false)}</td>
      <td>${esc(e.location)}</td>
      <td><span class="badge ${e.status === "active" ? "bg-success" : "bg-secondary"}">${esc(e.status)}</span></td>
      <td><button class="btn btn-danger btn-sm" data-hapus="${e.id}">Hapus</button></td>
    </tr>`).join("") || '<tr><td colspan="6" class="text-muted text-center">Belum ada event.</td></tr>';

  document.getElementById("orders").innerHTML = orders.map((o, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><strong>${esc(o.bookingCode)}</strong></td>
      <td>${esc(o.buyerName)}</td>
      <td>${esc(o.buyerEmail)}</td>
      <td>${esc(o.eventTitle)}</td>
      <td>${esc(o.ticketName)}</td>
      <td>${o.quantity}</td>
      <td>${rupiah(o.totalPrice)}</td>
      <td>${tanggal(o.createdAt, false)}</td>
    </tr>`).join("") || '<tr><td colspan="9" class="text-muted text-center">Belum ada pesanan.</td></tr>';
}

document.getElementById("events").addEventListener("click", async (ev) => {
  const id = ev.target.dataset.hapus;
  if (!id || !confirm("Hapus event ini?")) return;
  try {
    await api("/api/admin/events/" + id, { method: "DELETE" });
    await load();
  } catch (err) { handleAuth(err); }
});

document.getElementById("logout").addEventListener("click", async () => {
  await api("/api/admin/logout", { method: "POST" }).catch(() => {});
  location.href = "/admin/login";
});

load().catch(handleAuth);
</script>
</body>
</html>
