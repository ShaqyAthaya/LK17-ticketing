<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticketing Event</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="/app.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand fw-bold">🎟️ Ticketing Event</span>
</nav>

<div class="container my-5">
  <h4 class="mb-4">Event Tersedia</h4>
  <div class="row g-4" id="events"><p class="text-muted">Memuat...</p></div>
</div>

<script>
api("/api/events").then((events) => {
  const el = document.getElementById("events");
  if (!events.length) {
    el.innerHTML = '<p class="text-muted">Belum ada event tersedia.</p>';
    return;
  }
  el.innerHTML = events.map((e) => `
    <div class="col-md-4">
      <div class="card h-100 shadow-sm">
        ${e.bannerImage
          ? `<img src="${esc(e.bannerImage)}" class="card-img-top" style="height:180px;object-fit:cover;" alt="">`
          : `<div class="bg-secondary text-white d-flex align-items-center justify-content-center" style="height:180px;"><span>No Image</span></div>`}
        <div class="card-body">
          <h5 class="card-title">${esc(e.title)}</h5>
          <p class="text-muted small">📅 ${tanggal(e.eventDate)}</p>
          <p class="text-muted small">📍 ${esc(e.location)}</p>
          <a href="/detail?id=${e.id}" class="btn btn-dark w-100">Lihat Tiket</a>
        </div>
      </div>
    </div>`).join("");
}).catch((err) => showError(document.getElementById("events"), err.message));
</script>
</body>
</html>
